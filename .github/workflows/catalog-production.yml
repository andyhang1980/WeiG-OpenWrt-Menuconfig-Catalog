name: Publish Catalog Production
run-name: Catalog production · ${{ inputs.candidate_sha || 'current candidate' }} · run ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Optional catalog-candidate HEAD SHA to require / 可选：要求匹配的 catalog-candidate HEAD SHA"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: catalog-write-catalog-main
  cancel-in-progress: false

jobs:
  publish:
    name: Promote verified candidate / 晋级已验证候选
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch immutable production candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git clone --depth 1 --single-branch --branch catalog-candidate "$remote" candidate
          candidate_sha="$(git -C candidate rev-parse HEAD)"
          if [[ -n "$EXPECTED_CANDIDATE_SHA" ]]; then
            [[ "$EXPECTED_CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "candidate_sha must be a full Git SHA"; exit 1; }
            [[ "${EXPECTED_CANDIDATE_SHA,,}" == "$candidate_sha" ]] || { echo "catalog-candidate moved: expected $EXPECTED_CANDIDATE_SHA, got $candidate_sha"; exit 1; }
          fi
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
      - name: Verify candidate provenance and assets
        id: verify
        run: |
          set -euo pipefail
          node scripts/verify-production-candidate.mjs candidate "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          asset_ref="$(node -e "const i=require('./candidate/index.json'); process.stdout.write(i.assetRef)")"
          # assetRef may live on an isolated source-lane data history rather than being
          # an ancestor of catalog-candidate. Verify that the immutable commit exists;
          # candidate file hashes and provenance are verified independently above.
          git -C candidate fetch --no-tags --depth=1 origin "$asset_ref"
          git -C candidate cat-file -e "${asset_ref}^{commit}"
          git -C candidate show "$asset_ref:index.json" > "$RUNNER_TEMP/asset-index.json"
          node scripts/stamp-catalog-snapshot.mjs verify-assets candidate/index.json "$RUNNER_TEMP/asset-index.json"
      - name: Promote exact snapshot to catalog-main
        id: data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          production_ref="$(git ls-remote --heads "$remote" refs/heads/catalog-main)"
          if [[ -n "$production_ref" ]]; then
            git clone --single-branch --branch catalog-main "$remote" production
          else
            git init production
            git -C production checkout -b catalog-main
            git -C production remote add origin "$remote"
          fi
          git -C production config user.name github-actions[bot]
          git -C production config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rsync -a --delete --exclude=.git candidate/ production/
          git -C production add -A
          if git -C production diff --cached --quiet; then
            echo "catalog-main already matches the verified candidate."
          else
            git -C production commit -m "data: promote catalog candidate"
            git -C production push origin HEAD:catalog-main
          fi
          echo "production_sha=$(git -C production rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Re-read catalog-main identity
        env:
          EXPECTED_PRODUCTION_SHA: ${{ steps.data.outputs.production_sha }}
          EXPECTED_ASSET_REF: ${{ steps.verify.outputs.asset_ref }}
        run: |
          set -euo pipefail
          git -C production fetch --no-tags --depth=1 origin catalog-main
          remote_sha="$(git -C production rev-parse FETCH_HEAD)"
          [[ "$remote_sha" == "$EXPECTED_PRODUCTION_SHA" ]] || {
            echo "catalog-main moved after promotion: expected $EXPECTED_PRODUCTION_SHA, got $remote_sha"
            exit 1
          }
          git -C production show "$remote_sha:index.json" > "$RUNNER_TEMP/production-index.json"
          cmp -s candidate/index.json "$RUNNER_TEMP/production-index.json" || {
            echo "catalog-main index does not match the verified candidate"
            exit 1
          }
          git -C production fetch --no-tags --depth=1 origin "$EXPECTED_ASSET_REF"
          git -C production cat-file -e "${EXPECTED_ASSET_REF}^{commit}"
          git -C production show "$EXPECTED_ASSET_REF:index.json" > "$RUNNER_TEMP/production-asset-index.json"
          node scripts/stamp-catalog-snapshot.mjs verify-assets             "$RUNNER_TEMP/production-index.json" "$RUNNER_TEMP/production-asset-index.json"
      - name: Production summary
        run: |
          {
            echo "## Catalog production promotion"
            echo
            echo "- Code: \`${GITHUB_SHA}\`"
            echo "- Candidate: \`${{ steps.candidate.outputs.candidate_sha }}\`"
            echo "- Asset snapshot: \`${{ steps.verify.outputs.asset_ref }}\`"
            echo "- catalog-main: \`${{ steps.data.outputs.production_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
